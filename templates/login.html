<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Console - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1><i class="fas fa-cloud"></i> Serverless Admin</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Identity and Access Management (IAM)</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 10px; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; border: 1px solid var(--danger);">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label>IAM Username</label>
                <input type="text" name="username" placeholder="e.g. cloud-admin" required>
            </div>
            <div class="form-group">
                <label>Access Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Sign In to Console</button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--text-secondary);">
            <p>Demo Account: <strong>admin</strong> / <strong>password123</strong></p>
        </div>
    </div>
</body>
</html>
